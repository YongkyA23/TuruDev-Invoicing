services:
  invoices:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD}
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      TRUST_PROXY: "1"
    volumes:
      - invoices-data:/app/data
volumes:
  invoices-data:
