name: Validate invoicing
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: turudev_ci
          MYSQL_USER: turudev
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: turudev_ci
      MYSQL_USER: turudev
      MYSQL_PASSWORD: ci-app-password
      MYSQL_ROOT_PASSWORD: ci-root-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Package production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --production
          release_dir="$RUNNER_TEMP/turudev-invoicing"
          mkdir -p "$release_dir/public" "$release_dir/scripts"
          cp -a dist server package.json bun.lock node_modules "$release_dir/"
          cp public/turudev-logo.png "$release_dir/public/"
          cp scripts/backup.mjs scripts/migrate-sqlite-to-mysql.mjs scripts/reset-admin.mjs scripts/restore.mjs "$release_dir/scripts/"
          tar -C "$release_dir" -czf "$RUNNER_TEMP/turudev-invoicing.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: turudev-invoicing-${{ github.sha }}
          path: ${{ runner.temp }}/turudev-invoicing.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
